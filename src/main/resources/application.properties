spring.application.name=myciti-backend
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:myciti_db}}
spring.datasource.username=${DB_USER:myciti_user}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Database Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# HTTP Response Compression
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=1024

# Server Banner & Error Response Suppression
server.server-header=
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Cache Configuration
spring.cache.type=simple

# Flyway Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# App settings
app.timezone=Asia/Kolkata
app.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:5173},http://localhost:3000,http://127.0.0.1:5173
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-ttl-minutes=${JWT_ACCESS_TTL_MINUTES:15}
app.jwt.refresh-ttl-days=${REFRESH_TTL_DAYS:30}

# Auth & Google OAuth
app.auth.google-client-id=${GOOGLE_CLIENT_ID:}
app.auth.admin-emails=${ADMIN_EMAILS:}
app.auth.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.auth.cookie-secure=${COOKIE_SECURE:false}
app.auth.max-active-tokens-per-user=${MAX_ACTIVE_TOKENS_PER_USER:5}

# Cloudinary Configuration
app.storage.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.storage.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.storage.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Web Push (VAPID RFC 8292 / RFC 8291)
app.webpush.public-key=${WEBPUSH_VAPID_PUBLIC_KEY:}
app.webpush.private-key=${WEBPUSH_VAPID_PRIVATE_KEY:}
app.webpush.subject=${WEBPUSH_VAPID_SUBJECT:mailto:admin@myciti.com}


# Logging
logging.level.com.myciti=INFO
logging.level.org.springframework.web=INFO
logging.level.org.flywaydb=INFO

# Geospatial bounds: Pan-India (covering Andaman & Nicobar to Ladakh and Gujarat to Arunachal Pradesh)
app.city.bbox.min-lat=${CITY_BBOX_MIN_LAT:6.00}
app.city.bbox.max-lat=${CITY_BBOX_MAX_LAT:37.50}
app.city.bbox.min-lng=${CITY_BBOX_MIN_LNG:68.00}
app.city.bbox.max-lng=${CITY_BBOX_MAX_LNG:97.50}

# Multipart file upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# Mail / SMTP Configuration
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:false}
app.mail.from=${APP_MAIL_FROM:admin@myciti.com}
app.mail.enabled=${APP_MAIL_ENABLED:false}
